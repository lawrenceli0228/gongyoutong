# =============================================================================
# 工友通(GYT)· 持续集成
#
# 流水线全貌:
#
#   push / PR → main
#        │
#        ├─► lint-shell ──┐   (秒级:shell 脚本语法自检,不需要任何依赖)
#        │                │
#        ├─► test-frontend│   (vitest,前端纯函数)
#        │                │
#        ├─► test ────────┤   (主关卡:ruff + pytest,覆盖率 <80% 直接红)
#        │   3.11 / 3.12  │
#        │                ├──► e2e   (冒烟:后端能起来 + /ok 探活通过)
#        │                │          ├ 当前 continue-on-error,不拦合并
#        │                │          └ W3 接 Playwright 全量后去掉该开关
#        │                │
#        └─► image-changed┴──► build-push   ← **只在 push 到 main / 手点时**
#            (改动会不会          构建后端镜像 → 推 GHCR
#             进镜像?)           线上 VPS 只 pull,不再自己构建(2026-08-23)
#
#        ( eval —— W2 启用,见文件末尾被注释掉的 job )
#
# -----------------------------------------------------------------------------
# Action 版本核实记录(2026-08-06 修订):
#   actions/checkout        → @v7      (有浮动大版本标签 v7)
#   actions/upload-artifact → @v7      (有浮动大版本标签 v7)
#   astral-sh/setup-uv      → @v9.0.0  (**没有** v9 浮动标签,只能钉全版本号)
#
# 这里踩过一次坑,记下来免得重犯:
#   最初按 releases/latest 查到 v9.0.0,就写成了 @v9 —— CI 报
#     Unable to resolve action `astral-sh/setup-uv@v9`, unable to find version `v9`
#   原因是 GitHub Actions 解析的是 **git tag**,不是 release。
#   很多 action 会额外推一个浮动的大版本 tag(v7 跟着 v7.0.1 走),但**不是所有**都推。
#   astral-sh/setup-uv 的 tag 列表里只有 v9.0.0 / v8.3.2 / ...,没有裸 v9。
#   → 核实方法要用 tags 而不是 releases:
#       gh api "repos/<仓库>/tags?per_page=8" --jq '.[].name'
#   → actionlint 抓不到这一类错(它只验语法,不联网核实标签是否存在),
#     所以 `make lint-ci` 里额外加了一道 tag 存在性检查。
# 另注:网上多数教程还停在 checkout@v3 / setup-uv@v1,那些是过期写法,别抄。
# setup-uv v9 的输入项也已核实(action.yml):
#   version / python-version / working-directory / enable-cache /
#   cache-dependency-glob / cache-suffix 均存在且语义如下方使用方式。
# -----------------------------------------------------------------------------
# 刻意不做的事:
#   · 不跑任何真实模型调用 —— 测试全部 mock,CI 里也只给假 Key。
#   · 不在 PR 上构建镜像 —— 一次十几分钟(含 2.2GB 权重下载),
#     私有仓每月 2000 分钟的额度经不起每个 PR push 都烧一次。
#   · 不在「改动不进镜像」时构建 —— 见 image-changed job。
#
# ⚠️ **上面这段 2026-08-23 改过。** 原文写的是「刻意不在 CI 里构建后端镜像 ——
#    那会触发 2.2GB 权重下载,免费 runner 上又慢又容易超时……属于赛后的事」。
#    那个判断在**只考虑「CI 构建 vs 本地构建」时**是合理的,但它漏了线上那台
#    VPS 的约束:2 核 / 1966MB / 30GB,而镜像 6.3GB —— TODO-40 实测「这台机器上
#    全量重建从来就不成立」。也就是说「靠本地 make up 验证、线上自己构建」
#    这条退路**根本不存在**。CI 慢十几分钟是代价,不是理由。
#    完整推翻过程见 W7 手册 §2.1 顶部的订正框。
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # 允许在 Actions 页面手点运行,排查 CI 本身的问题时很有用
  workflow_dispatch:

# 同一分支上连续推送时,取消还在跑的旧任务,省额度也省等待
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 最小权限:CI 只读代码,不需要写仓库的任何权限
permissions:
  contents: read

env:
  # 后端代码根目录(相对仓库根)
  BACKEND_DIR: backend
  # 覆盖率门槛。与 Makefile 的 COV_MIN、方案里的验收标准是同一把尺子,
  # 三处必须一致,改这里就得同步改 Makefile。
  COV_MIN: "80"
  # 后端服务端口,与 backend/Dockerfile 的 EXPOSE、docker-compose.yml 一致
  BACKEND_PORT: "2024"

jobs:
  # ===========================================================================
  # job: lint-shell —— shell 脚本语法自检
  # 只用 bash 自带的 -n(只解析不执行),不装任何东西,十几秒出结果。
  # 目的:setup-frontend.sh 写错一个引号,不该等到有人真去装前端时才发现。
  # ===========================================================================
  lint-shell:
    name: shell 脚本语法检查
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: bash -n 语法自检
        run: |
          set -euo pipefail
          found=0
          # -print0 / read -d '' 组合:文件名含空格也不会被拆开
          while IFS= read -r -d '' script; do
            echo "检查 ${script}"
            bash -n "${script}"
            found=$((found + 1))
          done < <(find scripts -name '*.sh' -type f -print0)
          if [ "${found}" -eq 0 ]; then
            echo "::error::scripts/ 下没找到任何 .sh 文件,路径约定可能被改了"
            exit 1
          fi
          echo "共检查 ${found} 个脚本,语法均正常"

  # ===========================================================================
  # job: test-frontend —— 打卡链前端纯函数(W7)
  #
  # 独立成 job 而不塞进 test 矩阵:它不要 uv、不要 Python,塞进去只会让
  # 双版本矩阵把同一份 vitest 白跑两遍。真正的被测物是
  # scripts/frontend-overrides/checkin-lib.ts —— 七条 Base64URL 编码向量与
  # backend/tests/unit/test_checkin_api.py 的 ROUNDTRIP_VECTORS 同源,
  # 后端改编码这里会先红(这是它守门的全部意义)。
  # ===========================================================================
  test-frontend:
    name: 前端纯函数测试 (vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: 启用 corepack 并钉住 pnpm
        # 钉 10.5.1 与本机开发、frontend/package.json 的 packageManager 字段同一版本。
        # 不钉的话 corepack 取 latest —— 哪天 pnpm 大版本变更 lockfile 行为,
        # CI 与本机装出来的就不是同一套,而 --frozen-lockfile 的报错会指向锁文件。
        run: |
          corepack enable
          corepack prepare pnpm@10.5.1 --activate

      - name: 跑 vitest(经 make,与本机同一入口)
        run: make test-frontend

  # ===========================================================================
  # job: test —— 主关卡(静态检查 + 单元/集成测试 + 覆盖率门槛)
  #
  # 双 Python 版本矩阵的理由:
  #   3.11 是 pyproject 声明的下界(requires-python >=3.11),得保证真能跑;
  #   3.12 是 backend/Dockerfile 实际使用的版本,线上跑的就是它。
  #   只测一个的话,另一个迟早在最不该出事的时候出事。
  # ===========================================================================
  test:
    name: 测试 (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # 一个版本挂掉时,另一个继续跑完 —— 一次就能看到是"共性问题"还是"版本问题"
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    defaults:
      run:
        # 后续所有 run 步骤都在 backend/ 下执行,不用每条命令都写 cd
        working-directory: ${{ env.BACKEND_DIR }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 uv 与 Python
        uses: astral-sh/setup-uv@v9.0.0
        with:
          # 让 uv 装/选定指定版本的 Python(内部设置 UV_PYTHON)
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          # action 自身的工作目录(它要在这里找 pyproject.toml / uv.lock)。
          # 注意:defaults.run.working-directory 只作用于 run 步骤,
          # 对 uses 步骤无效,所以这里必须再写一次。
          working-directory: ${{ env.BACKEND_DIR }}
          # 缓存键跟着依赖清单走:依赖没变就直接复用缓存
          cache-dependency-glob: |
            backend/pyproject.toml
            backend/uv.lock
          # 两个 Python 版本的缓存分开存,避免互相污染
          cache-suffix: py${{ matrix.python-version }}

      - name: 同步依赖
        # 不加 --no-dev:CI 需要 dev 组里的 pytest / ruff。
        # 有 uv.lock 时用 --frozen 保证装的就是锁定版本,顺便验证 lock 没过期;
        # 尚未提交 lock 时退化为在线解析,并明确告警(骨架期的临时状态)。
        run: |
          set -euo pipefail
          if [ -f uv.lock ]; then
            uv sync --frozen
          else
            echo "::warning::未找到 backend/uv.lock,本次依赖为在线解析,构建结果不可复现。请尽快提交 lock 文件。"
            uv sync
          fi

      - name: 静态检查 (ruff check)
        run: uv run ruff check .

      - name: 导入自检 —— 整张图能不能 import
        # 为什么单列一步而不是靠单测:import gyt.graph 会连着走
        # langchain(create_agent)与 langgraph_supervisor 两条 import 链,
        # 依赖清单漏声明一个包(例如伞包 langchain)时,uv sync **不会报错**,
        # 直到有人真去 import 才 ModuleNotFoundError —— 而 `langgraph dev`
        # 和 Docker 容器启动走的正是这条路。让它成为一条不依赖测试覆盖的独立门禁。
        # 图是模块级构建的,会真的要 API Key,所以这里给假 Key。
        env:
          GYT_DEEPSEEK_API_KEY: ci-fake-deepseek-key
          GYT_MOONSHOT_API_KEY: ci-fake-moonshot-key
          GYT_DATA_DIR: ${{ runner.temp }}/gyt-import-check
        run: uv run python -c "import gyt.graph; print('图已构建:', gyt.graph.graph.name)"

      - name: 格式检查 (ruff format --check)
        # 已于 T1 合流时纳入门禁(2026-08-06):骨架跑过一次 `make fmt`,
        # 24 个文件全部格式化到位,ruff check 与 pytest 同时保持全绿,
        # 因此删掉了原来的 continue-on-error。格式从此和 lint 一样拦门。
        run: uv run ruff format --check .

      - name: 装水印中文字体(与线上镜像同一包,W7 §3.4)
        # 不装的话,test_attendance_watermark.py 里钉死 WQY 的缺字用例在 CI 上
        # 会 skip —— 而 macOS 本机它也 skip(PingFang 自带「𠮶」),两头都跳
        # 等于那条用例从未真跑过;Ubuntu runner 又没有任何 CJK 字体,连候选探测
        # 都会落空,水印测试整批起不来。装的必须是 fonts-wqy-microhei ——
        # 与 backend/Dockerfile app 阶段同一个包,CI 和线上测的才是同一份字体。
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-wqy-microhei

      - name: 单元与集成测试 + 覆盖率门槛
        env:
          # 假 Key:让 Settings 校验和 get_chat_model 的"缺 Key"分支不误触发。
          # 测试全部 mock,这些值永远不会真的发出去。真 Key 绝不进 CI。
          GYT_DEEPSEEK_API_KEY: ci-fake-deepseek-key
          GYT_MOONSHOT_API_KEY: ci-fake-moonshot-key
          # 缓存/数据目录指到 runner 的临时区,别污染工作副本
          GYT_DATA_DIR: ${{ runner.temp }}/gyt-data
        # --cov / --cov-report=term-missing 已经写在 pyproject 的 addopts 里,
        # 这里只补 CI 特有的两项:xml 报告(给产物)与真正的覆盖率门槛。
        run: |
          uv run pytest \
            --cov-report=xml \
            --cov-fail-under=${{ env.COV_MIN }}

      - name: 上传覆盖率报告
        # 失败时更需要看报告,所以用 always()
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-py${{ matrix.python-version }}
          path: ${{ env.BACKEND_DIR }}/coverage.xml
          # 测试在依赖同步阶段就挂掉时不会有 xml,别再叠一条红色噪音
          if-no-files-found: ignore
          retention-days: 7

  # ===========================================================================
  # job: e2e —— 冒烟(占位版)
  #
  # 现在只验证一件事:后端进程能起来,且 LangGraph 的 GET /ok 能通。
  # 这一条就足以拦住"图注册写错 / 模块 import 崩了 / 启动参数不对"这类
  # 单元测试照样全绿、但服务根本起不来的问题。
  #
  # W3 计划:换成 Playwright 全量流程(上传照片 → Safety 识图 → 出报告),
  #          同时删掉下面的 continue-on-error,让它真正成为门禁。
  # ===========================================================================
  e2e:
    name: 端到端冒烟 (占位)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 单测都没过就没必要起服务了,省额度
    needs: test
    # 占位阶段不拦合并。W3 接入 Playwright 时删掉这一行。
    continue-on-error: true

    defaults:
      run:
        working-directory: ${{ env.BACKEND_DIR }}

    env:
      GYT_DEEPSEEK_API_KEY: ci-fake-deepseek-key
      GYT_MOONSHOT_API_KEY: ci-fake-moonshot-key
      # 这里必须用 github.workspace 而不是 runner.temp:
      # runner 上下文只在 step 级可用,写在 job 级 env 里会让**整个 workflow 文件不合法**,
      # 表现是 GitHub 秒失败(0s)且不产生任何 job、check-runs API 也查不到注解,
      # 极难从报错本身定位。2026-08-06 首次 push 就栽在这儿。
      # 排查工具:docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:latest -no-color
      # job 级可用的上下文只有:github / inputs / matrix / needs / secrets / strategy / vars
      GYT_DATA_DIR: ${{ github.workspace }}/.gyt-e2e-data
      # 冒烟不打真实模型接口,只验证进程与路由;缓存开着也无妨
      GYT_LLM_CACHE_ENABLED: "true"

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 uv 与 Python
        uses: astral-sh/setup-uv@v9.0.0
        with:
          # 与 backend/Dockerfile 的基础镜像版本对齐,冒烟要贴近线上
          python-version: "3.12"
          enable-cache: true
          working-directory: ${{ env.BACKEND_DIR }}
          cache-dependency-glob: |
            backend/pyproject.toml
            backend/uv.lock
          cache-suffix: e2e

      - name: 同步依赖
        run: |
          set -euo pipefail
          if [ -f uv.lock ]; then uv sync --frozen; else uv sync; fi

      - name: 后台启动 LangGraph 服务
        # --no-reload   CI 里不需要热重载
        # --allow-blocking  本地嵌入模型是同步阻塞调用,不放行会被框架拦下
        # 日志重定向到文件,失败时整段打出来定位问题
        run: |
          set -euo pipefail
          nohup uv run langgraph dev \
            --host 127.0.0.1 \
            --port "${{ env.BACKEND_PORT }}" \
            --no-browser \
            --no-reload \
            --allow-blocking \
            > "${{ runner.temp }}/langgraph.log" 2>&1 &
          echo "$!" > "${{ runner.temp }}/langgraph.pid"
          echo "已在后台拉起服务,PID=$(cat "${{ runner.temp }}/langgraph.pid")"

      - name: 等待 /ok 探活通过
        # 退避策略:每 3 秒探一次,最多 40 次(约 2 分钟)。
        # 给这么久是因为首启要加载嵌入模型,冷启动本来就慢。
        #
        #   尝试 1 ──失败──► sleep 3 ──► 尝试 2 ──► ... ──► 尝试 40 ──► 超时打日志退出
        #        └──成功──► 立刻继续
        run: |
          set -euo pipefail
          readonly MAX_ATTEMPTS=40
          readonly SLEEP_SECONDS=3
          url="http://127.0.0.1:${{ env.BACKEND_PORT }}/ok"
          for attempt in $(seq 1 "${MAX_ATTEMPTS}"); do
            if curl --silent --fail --max-time 5 "${url}" > /dev/null; then
              echo "第 ${attempt} 次探活成功:${url}"
              exit 0
            fi
            # 进程已经死了就别再等满两分钟
            if ! kill -0 "$(cat "${{ runner.temp }}/langgraph.pid")" 2>/dev/null; then
              echo "::error::后端进程已退出,服务启动失败"
              break
            fi
            echo "第 ${attempt}/${MAX_ATTEMPTS} 次探活未通过,${SLEEP_SECONDS} 秒后重试"
            sleep "${SLEEP_SECONDS}"
          done
          echo "::error::后端在约 $((MAX_ATTEMPTS * SLEEP_SECONDS)) 秒内未就绪"
          echo "----- 服务日志 -----"
          cat "${{ runner.temp }}/langgraph.log" || true
          exit 1

      - name: 冒烟断言 —— 图 "gyt" 已注册
        # /assistants/search 返回已注册的图列表。
        # 图 ID 必须与 backend/langgraph.json 和前端 NEXT_PUBLIC_ASSISTANT_ID 一致,
        # 对不上就说明三处配置漂移了 —— 这正是冒烟要抓的东西。
        run: |
          set -euo pipefail
          response="$(curl --silent --fail --max-time 10 \
            -X POST "http://127.0.0.1:${{ env.BACKEND_PORT }}/assistants/search" \
            -H 'Content-Type: application/json' \
            -d '{"limit": 100}')"
          echo "${response}"
          echo "${response}" | grep -q '"gyt"' \
            || { echo "::error::已注册的图里找不到 \"gyt\",检查 backend/langgraph.json"; exit 1; }
          echo "冒烟通过:图 \"gyt\" 已正确注册"

      - name: 收尾 —— 停服务并归档日志
        if: always()
        run: |
          set -uo pipefail
          pid_file="${{ runner.temp }}/langgraph.pid"
          if [ -f "${pid_file}" ]; then
            kill "$(cat "${pid_file}")" 2>/dev/null || true
          fi
          echo "----- 服务日志(完整) -----"
          cat "${{ runner.temp }}/langgraph.log" 2>/dev/null || echo "(无日志)"

  # ===========================================================================
  # job: build-push —— 构建后端镜像并推 GHCR
  #
  # 为什么把构建搬到 CI(2026-08-23 定案,这是 TODO-40 的根治):
  #   线上那台 VPS 是 2 核 / 1966MB / 30GB,而后端镜像 6.34GB。TODO-40 实测过一次
  #   全量重建的峰值约 13.2GB,结论是「**这台机器上全量重建从来就不成立**」——
  #   以前能成全靠增量缓存,缓存一断就是那条事故链:撞盘 → tag 已经打到半截镜像 →
  #   Docker 29 的 containerd 把失去引用的旧镜像记录 GC 掉 → 容器还活着但既不能打
  #   tag、也不能重启,而 `docker ps` 和站点一切正常,外面完全看不出来。
  #
  #   W7 手册 §2.1 曾用「开发机上行 0.27 MB/s」把「离机构建再传」否掉,结论写成
  #   「在 VPS 上构,不要在开发机构了传」。**那条结论对被测的那个方案成立,当成通则
  #   就错了** —— 构建放在 CI 的话,开发机那条链路根本不在路径上。2026-08-23 补量:
  #   VPS 上行 6.72 MB/s、下行 20 MB/s。而镜像是分层的,改源码之后 VPS 只拉变化的
  #   那一层(`COPY . /app` 实测 2.96MB),权重那 2.3GB 一个字节都不重传。
  #
  # 🔴 三条别改错的:
  #   ① **只加载基础档 `docker-compose.yml`,绝不要再 `-f docker-compose.vps.yml`。**
  #      构建配置(context / dockerfile / target / args)整个在基础档里;vps 档只改
  #      image / ports / environment / volumes,没有 build 段。而 vps 档的
  #      environment 里有 `GYT_ACCESS_TOKEN: ${GYT_ACCESS_TOKEN:?…}` —— compose 是
  #      **解析期**求值,加载它会让 build 在还没开始时就失败。
  #   ② **构建参数一个都不许写在这个文件里。** `HF_ENDPOINT` 的真相在基础档的
  #      build.args,而它与 backend/Dockerfile 的 `ARG HF_ENDPOINT` 是 CLAUDE.md
  #      同源清单上登记过的一对(「全仓唯一允许的重复点」)。在 workflow 里再抄一份
  #      = 那一行从两处变三处,而漂了不报错:CI 用旧模型构建、线上向量库和查询向量
  #      不在一个空间里,检索全错而一声不吭。
  #   ③ **tag 用 commit SHA,不用浮动的 `:vps`。** 浮动 tag 的坏法是「以为部署了、
  #      其实跑的还是旧镜像」;而「线上现在是哪个提交」这个问题已经因为拿一个 12 天
  #      前的旧数做过一次错误的风险评估(见 TODO-33 的过期标注)。
  #
  # ⚠️ 第一版**刻意不接 buildx 的 GHA 缓存**:接它要往基础档的 build 段加
  #    cache_to/cache_from,而那个文件是本机开发也在用的。全量构建十几分钟、只在
  #    main 上跑,先按「无聊但正确」上线;等真的嫌慢再单独加,别在迁移里塞第二件事。
  # ===========================================================================
  # ===========================================================================
  # job: image-changed —— 这次改动会不会改变镜像内容?
  #
  # 2026-08-23 加的。当天合并 PR #60 时发现:那次**只改了文档和 compose**
  # (.env.vps.example / TODOS.md / docker-compose.vps.yml / docs/W7…md),
  # 一行后端源码都没动,而 CI 照样跑了一次完整构建 —— 十几分钟 + 2.2GB 权重下载,
  # 产出的镜像与线上正跑的那个功能完全一样。私有仓每月 2000 分钟,
  # 一天几次文档提交就很可观。
  #
  # 🔴 **判据刻意 fail-open:拿不准就构建。** 白构建一次只是浪费十几分钟额度;
  #    而漏构建的表现是「合进 main 了却没有对应的镜像」,要等到有人去部署、
  #    `docker pull` 报 manifest unknown 时才发现 —— 那时人多半正赶时间。
  #    这两种错的代价不对称,所以这里不追求判得准,只追求不漏。
  # ===========================================================================
  image-changed:
    name: 判断要不要重建镜像
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # 与 build-push 同一个条件:PR 上压根不构建,也就不用判
    if: github.event_name != 'pull_request'
    outputs:
      build: ${{ steps.decide.outputs.build }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          # 要和 push 之前那个提交比,浅克隆拿不到基线
          fetch-depth: 0

      - name: 判断
        id: decide
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          # 手点 workflow_dispatch 一律构建 —— 人显式要一个镜像,别猜他的意图
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "手动触发,无条件构建"
            echo "build=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          # 拿不到基线(新分支 / 强推 / 仓库首次推送)→ fail-open
          if [ -z "${BEFORE}" ] || [ "${BEFORE}" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "拿不到基线 '${BEFORE}',保守判为「要构建」"
            echo "build=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          changed="$(git diff --name-only "${BEFORE}" "${GITHUB_SHA}")"
          echo "本次改动的文件:"
          echo "${changed}" | awk '{print "  " $0}'

          # 会进镜像的东西:
          #   backend/**            构建上下文(Dockerfile 的 context 就是它)
          #   docker-compose.yml    build 段:context / dockerfile / target / args
          #   .github/workflows/ci.yml  改的是构建方式本身,重建一次去验
          # 排除 backend/tests/**:backend/.dockerignore 里 `tests` 把它挡在
          #   构建上下文之外,只改测试**不会**改变镜像内容。而本仓测试改得很勤,
          #   不排掉的话这个 job 基本等于没加。
          #   ⚠️ 判据来自 .dockerignore,那个文件改了要回来核这一行 ——
          #      而 .dockerignore 自己在 backend/ 下,改它必然触发构建,不会漏。
          matched="$(echo "${changed}" \
            | grep -E '^(backend/|docker-compose\.yml$|\.github/workflows/ci\.yml$)' \
            | grep -vE '^backend/tests/' || true)"

          if [ -n "${matched}" ]; then
            echo "build=true" >> "${GITHUB_OUTPUT}"
            echo "→ 要构建。触发它的是:"
            echo "${matched}" | awk '{print "  " $0}'
          else
            echo "build=false" >> "${GITHUB_OUTPUT}"
            echo "→ 跳过构建:没有任何改动会进镜像"
            echo "  (线上继续跑上一个镜像即可,不需要重新部署)"
          fi

  build-push:
    name: 构建后端镜像并推 GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # 单测没过就不必构建,省额度;image-changed 说不用建就不建。
    needs: [test, image-changed]
    # PR 上不跑。一次全量构建十几分钟(含 2.2GB 权重下载),而私有仓每月 2000 分钟
    # 的额度经不起每个 PR push 都烧一次。合进 main、或在 Actions 页面手点才构建。
    #
    # ⚠️ 这里**不能**只写 `needs`:job 之间的 needs 只管顺序与成败,
    #    不看 outputs。少了下面这个 if,image-changed 判出 false 也照样构建。
    if: needs.image-changed.outputs.build == 'true'

    permissions:
      contents: read
      # 推 GHCR 必需。工作流级只给了 contents:read,这里单独放开,别提到全局。
      packages: write

    env:
      # ⚠️ GHCR 的路径必须全小写。owner 目前是 lawrenceli0228(本来就是小写),
      #    哪天换成带大写的账号名,这里要加一步 tr '[:upper:]' '[:lower:]'。
      IMAGE: ghcr.io/${{ github.repository_owner }}/gyt-backend
      # ⚠️ **这里刻意不放假 Key。** 第一版放过,没用 —— 容器的环境变量来自基础档的
      #    `env_file: .env`,不是 runner 的 shell 环境。假 Key 要写进 .env,
      #    见下面「冒烟」那一步。删掉是为了不让下一个人以为这儿设了就生效。

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 登录 GHCR
        # 用内置的 GITHUB_TOKEN,不需要任何 PAT —— 上面那句 packages: write 就是它的授权。
        # (VPS 侧拉取才需要一把只读 PAT,那是另一回事,见部署文档。)
        run: |
          set -euo pipefail
          echo '${{ secrets.GITHUB_TOKEN }}' \
            | docker login ghcr.io -u '${{ github.actor }}' --password-stdin

      - name: 构建镜像(只用基础档,理由见上方 ①②)
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml build backend
          docker image inspect gyt-backend:dev --format '构建产物 {{.Id}} 大小 {{.Size}}'

      - name: 冒烟 —— 用 compose 自带的 healthcheck 起一次
        # 刻意走 `compose up` 而不是自己写探活:healthcheck 的定义在基础档里,
        # 抄一份到这儿就是第二份真相。数据目录要先 chown 到 10001 ——
        # 镜像里是非 root 用户跑的(Dockerfile 的 `USER gyt`,uid 10001),
        # runner 上新建的目录属主是 runner,容器写不进去。
        #
        # 🔴 **两把假 Key 必须写进 `.env`,写在 job 的 env 里没用。**
        #    基础档给 backend 挂的是 `env_file: .env`,容器的环境变量来自那个文件,
        #    不是 runner 的 shell 环境。而那条 env_file 是 **required: false** ——
        #    文件不存在时 compose **一声不吭**,容器照起,然后在加载图时抛
        #    MissingAPIKeyError 退出。2026-08-23 第一版就栽在这儿:job env 设了假 Key、
        #    看起来该生效,实际一个字节都没进容器,而 compose 没有任何提示。
        run: |
          set -euo pipefail
          mkdir -p data
          sudo chown -R 10001:10001 data
          printf 'GYT_DEEPSEEK_API_KEY=%s\nGYT_MOONSHOT_API_KEY=%s\n' \
            'ci-fake-deepseek-key' 'ci-fake-moonshot-key' > .env
          docker compose -f docker-compose.yml up -d backend
          for i in $(seq 1 40); do
            status="$(docker inspect gyt-backend --format '{{.State.Health.Status}}' 2>/dev/null || echo none)"
            [ "${status}" = "healthy" ] && { echo "容器 healthy(第 ${i} 次探测)"; break; }
            [ "${i}" = "40" ] && { echo "::error::镜像起来了但 200 秒没 healthy"; exit 1; }
            sleep 5
          done

      - name: 冒烟断言 —— 图 "gyt" 在镜像里也注册得上
        # 与 e2e job 那条同判据,但打的是**镜像里烤死的那份** langgraph.json。
        # e2e 跑的是源码,抓不到「文件没被 COPY 进镜像」这一类。
        run: |
          set -euo pipefail
          response="$(curl --silent --fail --max-time 15 \
            -X POST "http://127.0.0.1:${{ env.BACKEND_PORT }}/assistants/search" \
            -H 'Content-Type: application/json' -d '{"limit": 100}')"
          echo "${response}" | grep -q '"gyt"' \
            || { echo "::error::镜像里找不到已注册的图 \"gyt\""; exit 1; }
          echo '冒烟通过:镜像能起来,且图 "gyt" 已注册'

      - name: 收尾 —— 停容器并归档日志
        if: always()
        run: |
          set -uo pipefail
          echo "----- 容器日志 -----"
          docker compose -f docker-compose.yml logs --no-color backend 2>&1 | tail -100 || true
          docker compose -f docker-compose.yml down --remove-orphans || true

      - name: 打标签并推送
        run: |
          set -euo pipefail
          docker tag gyt-backend:dev "${IMAGE}:${GITHUB_SHA}"
          docker push "${IMAGE}:${GITHUB_SHA}"

      - name: 写部署提示到运行摘要
        # 用 printf 而不是 echo:这段要输出反引号、引号和路径,echo 在
        # shellcheck 下会连报 SC1003/SC2016/SC2028 三条,而 `make lint-ci`
        # 是 `&&` 串起来的,有任何输出就红。printf + 双引号取变量最省事。
        run: |
          set -euo pipefail
          {
            printf '## 后端镜像已就绪\n\n'
            printf '    %s:%s\n\n' "${IMAGE}" "${GITHUB_SHA}"
            printf '在 VPS 上部署,三步:\n\n'
            printf '1. 把 /opt/gyt/.env 里的 GYT_IMAGE_TAG 改成 %s\n' "${GITHUB_SHA}"
            printf '2. docker compose -f docker-compose.yml -f docker-compose.vps.yml pull backend\n'
            printf '3. docker compose -f docker-compose.yml -f docker-compose.vps.yml up -d --no-build --no-deps backend\n\n'
            printf '注意一:拉之前先量 df -h / 的可用,要不少于镜像大小 + 1G。\n'
            printf '注意二:确认新容器 healthy 之后**才**删旧镜像。顺序反了会撞上 TODO-40 记的那条\n'
            printf '        GC 事故链(tag 一移走,失去引用的旧镜像记录会被 containerd 回收,\n'
            printf '        于是容器还活着但既不能打 tag 也不能重启)。\n'
          } >> "${GITHUB_STEP_SUMMARY}"

