# =============================================================================
# 工友通(GYT)稳态覆盖件 —— 只干一件事:把 --no-reload 加回来
#
#   docker-compose.yml → docker-compose.dev.yml → **本文件**
#   (-f 的顺序不能反,后面的覆盖前面的)
#
# 用法(Makefile 已封好,正常别手敲):
#
#     make dev-docker-stable      起稳态后端(手工点界面、演示、真机验收走这条)
#     make dev-docker             起热重载后端(日常改代码走这条)
#
# -----------------------------------------------------------------------------
# 它在治什么病(2026-08-16 实测,macOS)
# -----------------------------------------------------------------------------
#   docker-compose.dev.yml 为了热重载**故意去掉** --no-reload(见它「为什么必须覆盖
#   command」那一节:只挂源码不改 command 的话,代码是新的、进程还是旧模块)。
#   那条理由在 Linux 上成立。
#
#   但在 macOS 上,Docker Desktop 的绑定挂载(VirtioFS)会**持续产生假的文件变更事件**:
#
#       日志里每 10 秒一次 "12 changes detected"
#       而 docker exec … find /app/src -newermt '-30 seconds'  →  空(没有文件真的在变)
#
#   后果不是「重载慢」,是**长请求做不完**:识图要 20-60 秒(TODO-11),而进程每 10 秒
#   被重启一次 —— 后端其实把活干完了(隐患已经登记进库),但 SSE 流断了,
#   界面永远停在「正在忙」。
#
#   🔴 **日志里没有任何一行报错。** 这是它最难查的地方,也是它值得单独成一个文件、
#      而不是"记得手动加个参数"的原因:这个坑的形态与本仓反复吃亏的那一类完全一样 ——
#      后端是对的、库里是对的、界面上什么都没有,而且零报错。
#
# -----------------------------------------------------------------------------
# 代价,先说清楚免得当成 bug
# -----------------------------------------------------------------------------
#   改 backend/ 下的 .py **不再自动生效**,要重启(秒级,不是重建镜像):
#
#       docker compose -f docker-compose.yml -f docker-compose.dev.yml \
#                      -f docker-compose.noreload.yml \
#                      up -d --no-deps --force-recreate backend
#
#   手工点界面联调时这个代价是零 —— 那会儿本来就不该有人在改代码。
#
# -----------------------------------------------------------------------------
# 为什么要把整个 command 抄一遍
# -----------------------------------------------------------------------------
#   compose 对 command 是**标量覆盖**,不是合并 —— 想加一个参数就得把整串重写。
#   所以下面这串必须与 dev 档那串**逐字一致、只多 --no-reload**。
#   ⚠️ `--allow-blocking` 一个字都不能少(与 Makefile 的 dev 目标同一条铁律):
#      缺了它 blockbuster 会把 config 的「访问即 mkdir」判成违规,**磁盘缓存读写
#      全部静默失败**,每次提问都真花钱,而日志里只有 "Background run succeeded"。
#      —— 又一个零报错的坑,别为了"精简"删它。
# =============================================================================

services:
  backend:
    command:
      - langgraph
      - dev
      - --host
      - "0.0.0.0"
      - --port
      - "2024"
      - --no-browser
      - --no-reload
      - --allow-blocking
      # 并发 2。理由与「为什么不能靠环境变量」写在 backend/Dockerfile 的 CMD 上方
      # (那份是主注释)。⚠️ 三处必须一致,见上面「为什么要把整个 command 抄一遍」。
      - --n-jobs-per-worker
      - "2"
