# =============================================================================
# 工友通(GYT)公网档 —— 给外部的人做测试用
#
#   叠在基础档上用(-f 顺序不能反,后面的覆盖前面的):
#
#       docker compose -f docker-compose.yml -f docker-compose.vps.yml up -d --build
#
#   和 docker-compose.dev.yml 是**并列**关系,不是叠加关系:
#   dev 档解决「改代码不重建镜像」,本档解决「怎么安全地放到公网上」。
#   两个档不要同时 -f 进来。
#
# -----------------------------------------------------------------------------
#   公网(0.0.0.0:80 / :443)
#        │
#        ▼
#   ┌──────────┐  这是整份编排里**唯一**有 ports 的服务
#   │  caddy   │  ① 登录页 + 会话 Cookie(给人的门,forward_auth → login)
#   └────┬─────┘
#        │  docker 内网,宿主机上看不到端口
#        ├── /       ──▶ frontend:3000    ← ports 被 !reset 掉了
#        └── /api/*  ──▶ backend:2024     ← ports 被 !reset 掉了
#                          │ ② auth.py 校验 X-Api-Key(纵深第二道)
#                          │ ③ 令牌桶限流(挡刷 run 烧账单)
#                          └ ./data 绑定挂载:台账 / 缓存 / 产物 / 向量库
# -----------------------------------------------------------------------------
#
# 为什么 backend 和 frontend 一个 ports 都不许有(本仓最硬的红线的直接推论):
#
#   :2024 是**零鉴权**的 Agent 执行端点,容器里还揣着两家供应商的真实 API Key。
#   基础档 docker-compose.yml 把它钉死在 127.0.0.1 正是为了挡这个。
#   到了 VPS 上,127.0.0.1 也不再是「只有我自己」—— 这台机器上任何一个进程、
#   任何一个别的容器、任何一个被打穿的服务,都能直接打 2024。
#   而 `docker compose -f A -f B` 的 ports 是**按端口去重后合并**的:
#   本档不写 ports 并不能把基础档那条抹掉,必须显式 `!reset []`(见下面两处)。
#
#   公网裸奔 = 账单敞开给人刷。这不是理论风险:VPS 的 IP 一上线,
#   几分钟内就会被全网扫描器摸一遍。
#
# -----------------------------------------------------------------------------
# 上线前必须先做的事(缺一步就起不来或者裸奔)
# -----------------------------------------------------------------------------
#   1. cp .env.vps.example .env      ← **必须叫 .env**,理由见文件末尾「关于 --env-file」
#   2. 生成 GYT_ACCESS_TOKEN(见 .env.vps.example)和 GYT_LOGIN_HASH
#      (`python scripts/make_login_hash.py`),填进去
#   3. 填两把模型 Key(GYT_DEEPSEEK_API_KEY / GYT_MOONSHOT_API_KEY)
#   4. mkdir -p data && sudo chown 10001:10001 data   ← Linux 上必做,
#      容器里跑的是非 root 用户,不改属主写不进这个绑定挂载
#   5. bash scripts/setup-frontend.sh                 ← frontend/ 不在仓库里
#   6. docker compose -f docker-compose.yml -f docker-compose.vps.yml up -d --build
#
#   忘了第 2 步会**当场失败并打中文**(下面的 ${VAR:?...} 语法),不会静默裸奔 ——
#   这是整份部署最重要的一道闸,别为了图省事给它加默认值。
# =============================================================================

# =============================================================================
# 日志轮转 —— 四个服务共用
# =============================================================================
# Docker 默认的 json-file 驱动**没有上限**,而这台机器是要无人值守长期跑的。
# 后端每条 HTTP 请求都打一整行结构化日志(langgraph_api.server 那种,一行 1KB 上下),
# Caddy 的 access log 也是每请求一行 —— 平时看着不起眼,几周之后就是几个 G。
#
# 症状特别难认:磁盘满了之后 Docker 写不动日志,容器行为变得莫名其妙
# (写不进去的那一刻起,表现从"服务正常"到"整台机器卡死"都有可能),
# 而人第一反应是查应用,不会想到是日志文件。
#
# 10m × 3 = 每个服务最多 30MB,四个共 120MB —— 排障够看,撑死也占不满盘。
# 放在编排里而不是 /etc/docker/daemon.json:daemon.json 不在仓库里、换台机器就没了,
# 而且改它要重启整个 docker 守护进程。
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ---------------------------------------------------------------------------
  # 后端:继承基础档的 build / healthcheck / volumes,只改公网相关的几处
  # ---------------------------------------------------------------------------
  backend:
    # ⚠️⚠️ 这一行是整个文件的核心。
    # 基础档有 `ports: ["127.0.0.1:2024:2024"]`,compose 合并时会保留它。
    # `!reset []` 是 Compose 的显式清空标记(比较新的特性,本机实测在
    # Compose v5.1.3 上生效;太老的 compose 上会直接报解析错误,不会静默失效 ——
    # 这点很重要:失败是响的,不会让你以为清掉了其实没清)。
    # 效果是合并后的配置里**根本没有 ports 这个键** —— 可以用
    #     docker compose -f docker-compose.yml -f docker-compose.vps.yml config | grep -n ports
    # 验证:除了 caddy 那两条,不该有任何输出。
    #
    # 删掉这行的后果:VPS 的 127.0.0.1:2024 上多出一个零鉴权端点。
    # 它不直接对公网,但它对**这台机器上的一切**开放,纵深防御的第一层就没了。
    ports: !reset []

    # 换个镜像 tag(基础档是 gyt-backend:dev)。
    # 不是洁癖:公网档要求 backend/langgraph.json 里声明了 auth,而那个文件**没有挂卷**,
    # 是烘在镜像里的。沿用 :dev 这个 tag 的话,机器上万一存着一个 auth 之前构建的
    # gyt-backend:dev,`up -d`(不带 --build)会直接拿它起来 —— 鉴权静默消失,
    # 而一切看起来都正常。换 tag = 镜像不存在 = 强制构建一次,把这条路堵死。
    image: gyt-backend:vps
    container_name: gyt-backend-vps

    environment:
      # 纵深第二道的令牌。后端 auth.py 拿它校验请求头 X-Api-Key。
      # 用 :? 让它成为硬性前置:没设就在 `up` 的那一刻失败,而不是起一个不设防的服务。
      GYT_ACCESS_TOKEN: ${GYT_ACCESS_TOKEN:?没设 GYT_ACCESS_TOKEN。这是后端校验 X-Api-Key 用的令牌,不设等于把零鉴权的 Agent 端点放上公网,两把模型 Key 的额度敞开给人刷。请先 cp .env.vps.example .env,按里面的命令生成一个再来}

      # 时区。**别省这一行。**
      # VPS 默认基本都是 UTC,而本项目的排期台账是按「今天/明天/本周五」算日期的
      # (backend/scripts/acceptance_dates.py 那套锚点)。差 8 小时的直接后果是:
      # 北京时间晚上 8 点之后建的任务,日期全部算成前一天 —— 界面不会报错,
      # 只是日子悄悄不对,而这种错最难被测试的人描述清楚。
      #
      # 已确认(backend/Dockerfile 第 246 行注释):基础镜像 python:3.12-slim-bookworm
      # 自带 /usr/share/zoneinfo,所以设了 TZ 就能生效,不用另外装 tzdata。
      TZ: ${TZ:-Asia/Shanghai}

    volumes:
      # ⚠️ 这一条是 2026-08-11 真机上**丢了一次数据**才加的。
      #
      # langgraph dev 把线程 / 检查点(= 用户看到的「历史对话」)存在
      # `/app/.langgraph_api/.langgraph_ops.pckl`,而那是**容器自己的 overlay 文件系统** ——
      # 不在 ./data 那条挂载里。后果:`docker compose up -d --force-recreate backend`
      # 或者任何一次镜像更新,**把所有历史对话清零**。
      #
      # 怎么发现的:跑完 14 个演示场景、强制重建了一次 backend 容器之后,
      # `POST /threads/search` 从 14 条变成 1 条。产物(照片 / docx)还在
      # ——它们落在 ./data 里——但**对话没了**,而界面上看不出区别,
      # 只是历史列表突然空了,人会以为是前端出了问题。
      #
      # 挂到 ./data 下面而不是另开命名卷:data/ 已经是「这台机器的全部状态」这一个概念,
      # 备份/迁移只需要拷一个目录。属主必须是 10001(preflight ④ 组在查)。
      - ./data/langgraph:/app/.langgraph_api

    # 基础档是 on-failure:3(本机开发时「起不来就停住,现象一眼可见」)。
    # 公网跑法相反:机器重启、docker 自己升级之后要能自己回来,不然得有人手动上机器。
    # 注意这不会掩盖「缺 Key 起不来」—— 那种情况下容器会反复重启,
    # `docker compose ps` 一眼就能看见 Restarting。
    restart: unless-stopped

    logging: *default-logging

  # ---------------------------------------------------------------------------
  # 前端:agent-chat-ui。同样不许有 ports,只让 caddy 从内网访问
  # ---------------------------------------------------------------------------
  frontend:
    # 基础档里 frontend 挂在 profiles: [ui] 下,默认不启动。
    # 公网档必须让它默认起来,否则 `up -d` 只起后端,caddy 一路 502。
    profiles: !reset []

    # 理由同 backend:基础档有 127.0.0.1:3000:3000,必须显式清掉。
    ports: !reset []

    image: gyt-frontend:vps
    container_name: gyt-frontend-vps

    build:
      # build.args 是映射,按键合并 —— 这里覆盖基础档那两个,并加一个新的。
      args:
        # ⚠️ NEXT_PUBLIC_* 是 Next.js 的**编译期**变量,会被烘进浏览器 JS 包。
        # 必须在 build 阶段给;只写在 environment 里对浏览器是无效的。
        # 改了这两个值就必须 `--build` 重建前端镜像,只 restart 不管用。
        #
        # 值指向 Caddy 的 /api 前缀,而不是后端的 2024 端口:
        # 请求由浏览器发出,浏览器只认识公网那一个地址;而且前后端同源之后,
        # 不用配 CORS,basic_auth 的凭据也会被浏览器自动带上。
        NEXT_PUBLIC_API_URL: ${GYT_PUBLIC_ORIGIN:?没设 GYT_PUBLIC_ORIGIN。这是测试的人在浏览器里敲的那个地址,比如 http://203.0.113.10 或 https://gyt.example.com。它会被编译进前端包,填错的表现是页面打得开但一发消息就连不上}/api

        # 令牌注进浏览器包,测试的人不用手动粘。
        #
        # 「把令牌放进浏览器包」是刻意的取舍,不是疏忽:它确实躺在 JS 里可见,
        # 但**能拿到这个包的人已经过了 Caddy 那道口令门**。在这个前提下,
        # 令牌的作用是纵深(挡 Caddy 配错、挡内网直连),不是挡终端用户。
        # 换来的是外部测试的人只需要记一个口令,不用被教「打开设置粘一串 hex」。
        #
        # ⚠️ 前置依赖:`scripts/setup-frontend.sh` 生成的 frontend/Dockerfile 里
        #    必须有 `ARG NEXT_PUBLIC_API_KEY` 和对应的 ENV。
        #    **现在有了**(2026-08-11 上线时实测:构建产物 .next/static/chunks/app/page-*.js
        #    里搜得到完整 64 位令牌)。但这条依赖必须一直写在这儿,因为漏了它**不会报错**:
        #    Docker 对没声明的 build arg 只警告一句 "unused build arg" 就过去了,
        #    构建成功、页面能开,只是令牌永远没进包 —— 表现是每次提问被后端 401。
        #    `scripts/preflight_vps.sh` 第 ④ 组会专门查这一条。
        NEXT_PUBLIC_API_KEY: ${GYT_ACCESS_TOKEN:?没设 GYT_ACCESS_TOKEN(前端也要用同一个令牌)}

        # 产物(工地照片 / 巡检记录 docx)的静态出口,同样是编译期烘进浏览器包。
        #
        # 不传这个值的下场:覆盖件退回默认的 http://127.0.0.1:8788,
        # 而那在测试者的浏览器里指的是**他自己的电脑** —— 照片全是碎图、
        # 巡检记录点了没反应;更麻烦的是 https 页面拉 http 资源属于 mixed content,
        # 浏览器**连请求都不会发**,只在控制台留一行,界面上一点线索都没有。
        #
        # 走 ${GYT_PUBLIC_ORIGIN}/artifacts 是同源路径,由 Caddyfile 的
        # `handle_path /artifacts/*` 转给下面那个 artifacts 服务,顺带也在口令门后面。
        NEXT_PUBLIC_ARTIFACT_BASE: ${GYT_PUBLIC_ORIGIN}/artifacts

    environment:
      # 运行期再写一遍,浏览器包用不到它(编译期已经烘进去了),
      # 留着是为了让 `docker compose config` 和 `docker inspect` 一眼能看出这台连的是哪儿,
      # 排障时不用去翻构建参数。
      NEXT_PUBLIC_API_URL: ${GYT_PUBLIC_ORIGIN}/api
      TZ: ${TZ:-Asia/Shanghai}

    restart: unless-stopped

    logging: *default-logging

  # ---------------------------------------------------------------------------
  # 产物只读静态服务:把工地照片 / 巡检记录 docx 递出去
  # ---------------------------------------------------------------------------
  # 为什么需要单独一个服务:产物落在 data/artifacts/<日期>/<32位id>.<ext>,
  # 而 langgraph.json 只声明了图 —— **后端没有任何 HTTP 端点能把文件给出去**。
  # 本机开发靠 `make serve-artifacts`(宿主上跑,只绑 127.0.0.1);
  # 公网部署就得有个容器化的等价物,否则「拍照 → 出巡检记录」这条主演示路径
  # 在界面上的最终形态是一个打不开的链接。
  #
  # 用 python:3.12-slim 而不是复用 backend 镜像:
  #   · scripts/ 不在 backend 的构建上下文里(context 是 ./backend),复用不了;
  #   · 这个服务只用标准库(http.server),不需要 torch 那 6.37GB 里的任何东西;
  #   · 隔离得越干净,它被打穿时能碰到的东西越少 —— 它挂的两个卷都是 :ro。
  artifacts:
    image: python:3.12-slim
    container_name: gyt-artifacts

    # 与 backend 同一个非 root uid。它只读两个 :ro 卷、不发布端口,
    # 用 root 跑本来也不至于出事 —— 但这个服务的输入是**公网来的 URL 路径**
    # (路径穿越、软链接那一类),纵深一点不亏。
    # data/artifacts 是 10001 建的,读得到。
    user: "10001:10001"

    # ⚠️ 一个 ports 都不许有 —— 和 backend / frontend 同一条红线。
    # 这条不只是惯例:scripts/serve_artifacts.py 的 BIND_HOST 是「在容器里就绑
    # 0.0.0.0」,它敢这么做的**唯一前提**就是这个服务不发布端口。
    # 谁在这儿加一行 ports,就等于把工地现场照片(含可识别人脸,见 TODO-22)
    # 直接挂到公网上,而且不会有任何报错。
    # `scripts/preflight_vps.sh` 第 ⑤ 组数「发布端口总数」,多一条就露馅。
    command:
      - python
      - /srv/serve_artifacts.py
      - --port
      - "8788"
      - --directory
      - /srv/artifacts

    volumes:
      # 脚本本身只读挂进来,改了 restart 一下就生效,不用重建镜像
      - ./scripts/serve_artifacts.py:/srv/serve_artifacts.py:ro
      # 产物目录只读 —— 这个服务永远只往外读,写入是 backend 的事
      - ./data/artifacts:/srv/artifacts:ro

    environment:
      TZ: ${TZ:-Asia/Shanghai}
      # 无缓冲。脚本自己的 print 已经带 flush=True,这里兜的是 Python 别的输出
      # (traceback、warning)—— 输出不是终端时 stdout 会变成块缓冲,要攒够 8KB 才吐,
      # 而这个进程会一直跑下去,于是报错**永远出不来**,`docker compose logs` 里一片空白。
      # 不用 `tty: true` 办这件事:那是靠"假装有终端"顺带得到行缓冲,副作用是
      # 日志里混进控制字符、Ctrl-C 语义也变,属于用副作用当功能使。
      PYTHONUNBUFFERED: "1"

    restart: unless-stopped

    logging: *default-logging

  # ---------------------------------------------------------------------------
  # 每天的定时活儿:① 备份台账与对话历史 ② 清理到期的考勤凭证图
  # ---------------------------------------------------------------------------
  # ⚠️ 2026-08-21 这个服务叫 `backup`,同日改名 `housekeeping`(多了第二件活儿)。
  #    改名之后旧容器 `gyt-backup` 会变成**孤儿**:compose 不带 `--remove-orphans`
  #    是不会动它的,于是两个容器一起备份、一起轮转,互相把对方的快照删掉,
  #    而 `docker compose ps` 只列得出新的那个。部署这一版必须:
  #        docker compose … up -d --remove-orphans
  #    (下次再改名同理。这条不写下来,下一个人只会看见「备份数量莫名其妙对不上」。)
  #
  # 为什么要有这个服务(五路复查里最硬的两条,恰好同一个落点):
  #   ① 在它之前,这个文件里**没有一个服务是备份**。唯一的「备份」是
  #      docs/W7_上线实录与部署踩坑.md 里一条要人在部署前手动跑的 rsync ——
  #      而那条 rsync 已经删掉过一次对话历史、改过 data/ 属主(§2.3 / §2.5)。
  #      也就是说:防数据丢失的机制,本身就是已经出过事的那一个,而且要人记得跑。
  #      而库里装着**已签发的《工程暂停令》/《复工令》记录**。
  #   ② 登录页那份 PDPO(第486章)个人资料收集声明写着「憑證照片保存 90 天後
  #      自動刪除」——而机器上 `crontab -l` 是 `no crontab for root`,
  #      systemd 也没有任何相关 timer。**那句承诺背后一直没有任何机制。**
  #      清理器(gyt.attendance.cleanup)本身早就写好了,只是从来没人调它。
  #
  # 为什么放 compose 而不是宿主 crontab / systemd timer:
  #   宿主配置不进 git、review 不到、换机器不跟着走 —— 那正是 ② 的成因本身。
  #   放这儿它跟着部署走,而且改动看得见。
  #
  # 备什么、不备什么:见 backend/scripts/backup_data.py 的头注。
  # 一句话:台账(88 KB)和对话历史备;artifacts(122 MB)**不备** ——
  # 同一块盘上多放几份不叫备份,盘坏了一起没,它要的是机器外面的同步。
  housekeeping:
    image: gyt-backend:vps   # 复用后端镜像:它有 python 和 gyt 包,不用再引一个镜像进来
    container_name: gyt-housekeeping

    # ⚠️ 一个 ports 都不许有 —— 和 backend / frontend / artifacts 同一条红线。
    # preflight ⑤ 组数「发布端口总数」,应当恒为 3(80 / 443tcp / 443udp)。

    # 不覆盖 user:镜像自己就跑在 uid 10001(gyt),与 data/ 的属主一致。
    # 🔴 宿主上的 ./backups 必须先建好并且属主是 10001,否则容器写不进去:
    #      mkdir -p backups && sudo chown 10001:999 backups
    #    忘了的后果不是静默 —— 首轮就写不成,容器退出,`docker compose ps`
    #    里会看到 Restarting(下面那个循环刻意这么设计的)。
    command:
      - sh
      - -c
      - |
        # 首轮立刻跑一次:别让「有没有备份」这件事等 24 小时才有答案。
        # 退出码约定见 backup_data.py 头注:1 = 库还没建(全新部署,正常),
        # 2 = 备份没通过验证(真故障 —— 退出,让 ps 里的 Restarting 说话)。
        python -m scripts.backup_data
        code=$$?
        if [ "$$code" = "2" ]; then
          echo "首轮备份没通过验证 —— 容器退出。docker compose ps 会显示 Restarting。"
          exit 1
        fi

        # 考勤凭证图的留存清理。**顺序是刻意的:先备份、再删图。**
        # 反过来的话,删完还没来得及备就崩,那批图连同它们的台账行一起没了。
        #
        # 🔴 --apply 不是可选项:不带它清理器只演练、一个字节都不删,
        #    而登录页的 PDPO 声明写着「90 天後自動刪除」。少了这四个字符,
        #    这个服务会每天打印一份漂亮的「将要删 N 张」然后什么都不做,
        #    日志看着完全正常。
        # 退出码 1 = 有该删没删掉的(见 cleanup.py:193),记一句、不退出:
        # 单张删不掉(权限/占用)不该把整个定时活儿停掉,下一轮还会再试。
        python -m gyt.attendance.cleanup --apply \
          || echo "考勤清理有该删没删掉的(码 $$?),详见上方逐条输出,下一轮再试。"

        while true; do
          sleep 86400
          python -m scripts.backup_data || echo "这一轮备份没成(码 $$?),下一轮再试。"
          python -m gyt.attendance.cleanup --apply \
            || echo "这一轮考勤清理有该删没删掉的(码 $$?),下一轮再试。"
        done

    volumes:
      # 🔴 data 必须是**可写**挂载,不能加 :ro。两个理由,缺一个都不行:
      #    ① SQLite 开了 WAL 之后(core/sqlite_util.py,2026-08-21),连读都需要能写
      #       -shm 那个共享内存文件;只读挂载会让备份直接打不开库。
      #    ② 考勤清理器**真的会删 data/artifacts 下的文件**(到期凭证图),
      #       并把台账里对应的行置 NULL。
      #    ⚠️ ② 是 2026-08-21 加清理这一步时才成立的 —— 在那之前这里写着
      #       「这个容器只跑备份脚本,对 data/ 只读不写」,现在那句话是错的。
      #       给这个容器的权限从此不再是「读」,review 时按「会删文件」看待。
      #       它删什么、不删什么的边界在 attendance/cleanup.py 头注:
      #       **只碰 kind=ATTENDANCE 的产物**,巡检照片 / 图纸 / 报告一律不碰。
      - ./data:/app/data
      # 备份落在 data/ **外面**。放里面的话下一次备份会把上一次也装进去,
      # 几轮之后每份都套着前面所有份,而没有任何东西会说话。
      - ./backups:/backups

    environment:
      GYT_DATA_DIR: /app/data
      TZ: ${TZ:-Asia/Shanghai}
      # 同 artifacts 服务那条理由:这个进程会一直跑下去,块缓冲会让报错永远出不来。
      PYTHONUNBUFFERED: "1"

    restart: unless-stopped

    logging: *default-logging

  # ---------------------------------------------------------------------------
  # 登录服务:登录页 + 会话 Cookie。替掉浏览器那个原生 basic_auth 弹框
  # ---------------------------------------------------------------------------
  # Caddy 用 forward_auth 把每个请求先甩给它验一下会话(见 Caddyfile 的 route 块)。
  # 为什么不继续用 basic_auth:那个弹框是**浏览器自己画的**,不可美化;
  # 只要服务端回 `WWW-Authenticate: Basic` 它就一定会弹。完整推理在 serve_login.py 顶部。
  #
  # 和 artifacts 服务同一套形态(python:3.12-slim + 标准库 + 只读挂载 + 无 ports),
  # 理由也一样:不为一个哈希函数多背一个 pip 包和一条构建期网络依赖。
  login:
    image: python:3.12-slim
    container_name: gyt-login

    # 与 backend 同一个非 root uid。它的输入是**公网来的口令和 Cookie**,纵深一点不亏。
    user: "10001:10001"

    # ⚠️ 一个 ports 都不许有 —— 同 artifacts。
    # serve_login.py 的 BIND_HOST 在容器里绑 0.0.0.0,**唯一前提就是这个服务不发布端口**。
    # preflight ⑤ 组数「发布端口总数」(应为 3)就是在守这条。
    command:
      - python
      - /srv/serve_login.py
      - --port
      - "8790"

    volumes:
      # 服务和登录页都只读挂进来:改完 restart 一下就生效,不用重建镜像。
      # 登录页是纯静态的(错误态靠 URL 上的 ?e=1 在前端切),服务端一个字节的
      # 用户输入都不回显 —— 连一个反射面都不留。
      - ./scripts/serve_login.py:/srv/serve_login.py:ro
      - ./scripts/login-page.html:/srv/login-page.html:ro

    environment:
      # 口令哈希。**scrypt 不是 bcrypt** —— hashlib.scrypt 在标准库里,bcrypt 不在。
      # 生成:python scripts/make_login_hash.py(它会把 $ 加倍好,直接粘)。
      # 用 :? 让它成为硬性前置:不设就在 `up` 那一刻失败,而不是起一个不设防的站点。
      GYT_LOGIN_HASH: ${GYT_LOGIN_HASH:?没设 GYT_LOGIN_HASH。这是登录页要校验的口令哈希,不设等于整个站点对全网敞开。生成:python scripts/make_login_hash.py}
      TZ: ${TZ:-Asia/Shanghai}
      # 理由同 artifacts:输出不是终端时 stdout 变块缓冲,报错永远出不来
      PYTHONUNBUFFERED: "1"

    restart: unless-stopped

    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Caddy:反向代理 + 会话门。整份编排里唯一对公网开口的服务
  # ---------------------------------------------------------------------------
  caddy:
    # 官方镜像,不自己构建。
    # ⚠️ 别换成需要插件的玩法(限流 rate_limit、WAF 之类):官方镜像**不带**那些模块,
    # 写了对应指令的下场是 Caddy 启动即报 unrecognized directive,整个站点连不上。
    # 限流由后端做(令牌桶),不在这一层。
    image: caddy:2-alpine
    container_name: gyt-caddy
    init: true

    ports:
      # 这里**故意**不写 127.0.0.1 —— 就是要让公网进来,这是本服务存在的意义。
      # 也正因为如此,上面两个服务才必须一个 ports 都没有。
      - "80:80"
      # 443 即便暂时用裸 IP(GYT_SITE_ADDRESS=":80")也留着:
      # 哪天换成域名,Caddy 会自动签证书并把 80 跳到 443,不用回来改这个文件。
      # 端口开着但没人监听,不构成额外风险。
      - "443:443"
      # 443/udp 是 HTTP/3(QUIC)。没有它 Caddy 也能跑,浏览器会退回 HTTP/2。
      - "443:443/udp"

    volumes:
      # Caddyfile 只读挂进去。改完 `restart caddy` 秒级生效,不用重建镜像。
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # 证书和 ACME 账号密钥。**必须持久化**:走域名时,证书丢了就要重新申请,
      # 而 Let's Encrypt 对同一域名有签发频率限制(一周几次),
      # 反复重建容器足够把自己关在门外,现象是「HTTPS 突然就申请不下来了」。
      - caddy_data:/data
      - caddy_config:/config

    environment:
      # 站点地址。裸 IP 用 :80(纯 HTTP);有域名就直接填域名,Caddy 自动签证书。
      # 两种写法的完整说明在 Caddyfile 里那一大段注释。
      GYT_SITE_ADDRESS: ${GYT_SITE_ADDRESS:-:80}

      # ⚠️ 2026-08-11 起,caddy **不再碰口令哈希** —— 校验搬到了 login 服务里
      # (`forward_auth`,见 Caddyfile 的 route 块)。原来这里有
      # GYT_BASIC_AUTH_USER / GYT_BASIC_AUTH_HASH 两个变量,现在都不需要了。
      #
      # 那个「哈希里的 $ 会被 Compose 吃掉」的坑**没有消失,只是搬了家**:
      # scrypt 哈希同样用 `$` 分段,所以 .env 里的 GYT_LOGIN_HASH 也必须把 `$` 写成 `$$`。
      # `scripts/make_login_hash.py` 直接吐出加倍好的串,照抄粘贴即可。
      # 写坏了的表现依旧是**不报错、口令永远对不上**。

      TZ: ${TZ:-Asia/Shanghai}

    # ⚠️ 注意这里**没有** env_file。
    # 基础档给 backend 挂了 `env_file: .env`,那是它要读两把模型 Key。
    # Caddy 一把 Key 都不该碰 —— 它只需要上面这四个变量,用 ${} 逐个点名注入。
    # 顺手写个 env_file 图省事,等于把 DeepSeek / Moonshot 的 Key 复制一份进
    # 一个直接对公网监听的容器里,毫无必要地扩大了泄漏面。

    depends_on:
      backend:
        # 等后端 /ok 真探活通过再起 caddy。
        # 后端首次启动要把 BGE-M3 权重加载进内存,基础档给了 start_period: 120s。
        condition: service_healthy
      frontend:
        condition: service_started
      artifacts:
        # 只等它起来,不等健康 —— 这个服务没有 healthcheck,而且晚几秒无所谓:
        # 它只在用户点开照片 / 巡检记录时才被访问,不在首屏路径上。
        condition: service_started
      login:
        # 这个**在首屏路径上**:它没起来的话,forward_auth 拿不到 204,
        # 整站每个请求都会 502 —— 包括登录页自己。
        condition: service_started

    # 探活:故意断言「返回 302」,而不是「返回 200」。
    #
    # 这不是绕弯子 —— 302 同时证明了两件事:Caddy 活着、**并且会话这道门是开着的**
    # (未登录访问 / 会被 forward_auth 打回登录页)。
    # 如果哪天那道门被误删/写错位置,站点会变成 200 全放行,
    # 而一个「探 200」的健康检查会高高兴兴地报 healthy,没人发现已经裸奔了。
    # 现在这种写法下,那种情况会让容器直接变 unhealthy。
    #
    # ⚠️ 2026-08-11 从 401 改成 302:换成登录页之后,未登录访问不再回 401,
    #    而是 302 跳 /login。**这一条漏改的表现是 caddy 永远 unhealthy**,
    #    而站点其实好好的 —— 人会去查一个不存在的故障。
    healthcheck:
      # 这条不只是「进程还活着」,它同时是**一条持续的门禁检查**:
      # 302 = 会话门还在岗。哪天有人把它注释掉调试完忘了加回来,这里立刻变红。
      #
      # ⚠️⚠️ 两种模式**必须分开探**,这条 2026-08-11 真机验过三遍才写对:
      #
      #   裸 IP(GYT_SITE_ADDRESS=":80")  → 探 http://127.0.0.1:80/          → 302
      #   域名(GYT_SITE_ADDRESS=域名)    → 探 https://<域名>/ 且要走对 SNI  → 302
      #
      # 域名模式下探 :80 **恒定拿到 308**(Caddy 自动 HTTPS 的重定向按主机名挂),
      # 加不加 Host 头都一样 —— 我一开始就是这么写错的,结果是 caddy 永远 unhealthy,
      # 人去排查一个不存在的故障,而这条检查真正的职责(口令被误删就变红)已经悄悄失效。
      #
      # 用 curl 不用 wget:caddy:2-alpine 里的 busybox wget 走 https 时**不发 SNI**,
      # Caddy 选不出证书,握手直接炸(实测 `tlsv1 alert internal error`)。
      # curl 的 --resolve 才能既走对 SNI、又把域名解析钉到本机回环。
      # -k 是因为自签/内部证书也要能探通;这是本机自己探自己,不需要验证书链。
      #
      # `$$` 是 compose 的转义(让 shell 在容器里运行时展开);整条用 YAML 单引号包起来,
      # 否则里面的 `:` 和 `*` 会被当成映射键/别名解析,直接报 mapping values 错。
      test:
        - CMD-SHELL
        - 'A="$${GYT_SITE_ADDRESS}"; case "$$A" in :*) U=http://127.0.0.1:80/; R=;;
          *) H="$${A%%:*}"; U=https://$$H/; R="--resolve $$H:443:127.0.0.1";; esac;
          curl -sk -o /dev/null -w %{http_code} --max-time 5 $$R "$$U" | grep -q 302'
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    restart: unless-stopped

    logging: *default-logging

# -----------------------------------------------------------------------------
# 命名卷:只给 Caddy 用
# 业务数据一律走基础档的 ./data 绑定挂载(台账 / LLM 缓存 / 产物 / Chroma 向量库),
# 那份要能被 `ls`、能被 scp 下来看,所以是绑定挂载而不是命名卷。
# 证书正相反:不需要人去翻,也不该被人随手打开,交给 Docker 管更合适。
# -----------------------------------------------------------------------------
volumes:
  caddy_data:
  caddy_config:

# =============================================================================
# 几件容易踩的事,写在这儿免得下一个人再查一遍
# -----------------------------------------------------------------------------
#
# 【关于 --env-file】
#   本档假定 VPS 上的环境变量放在**仓库根的 .env**(由 .env.vps.example 复制而来)。
#   别用 `docker compose --env-file .env.vps ...` 这种写法:
#   --env-file 只影响 compose 自己做变量插值,**不影响** 基础档里 backend 的
#   `env_file: .env`。那条是 required:false,文件不存在时**不报错**,
#   于是后端启动时一把模型 Key 都没有 —— 报错发生在图加载期,
#   现象是容器反复重启,而根因(你把变量放在另一个文件里了)一点提示都没有。
#
# 【关于机器规格】
#   2C4G 起步,这是下限不是舒适区。吃内存的大头是 knowledge 用的本地
#   BGE-M3 embedding 模型(权重 2.2GB,推理时还要再占一块)。
#   1C2G 的机器上表现是:建库或首次检索时容器被 OOM killer 干掉,
#   `docker compose ps` 显示 Exited(137),日志里什么都看不出来。
#
#   这里**故意不写 deploy.resources.limits**。在一台 4G 的机器上,
#   给唯一一个吃内存的服务再加一道内存上限,只是把「慢」变成「被 kill」,
#   换不来任何隔离收益 —— 反正也没有别的服务要保护。
#   如果这台 VPS 还跑着别的东西,再回来加,并且加之前先量一下实际占用:
#       docker stats gyt-backend-vps
#
#   另外建议在 VPS 上开 2G swap。BGE-M3 加载权重那一下是尖峰,
#   有 swap 兜着就是慢几秒,没有就是 OOM。
#
# 【关于知识库】
#   `GYT_KNOWLEDGE_PREBUILD_AT_STARTUP=true` 在这套编排里**千万别开**:
#   首次建库要十几分钟,而 backend 的 healthcheck start_period 是 120s,
#   结果是容器永远探不活 → caddy 因为 depends_on 也起不来 → 整站打不开。
#   正确顺序是先把库建好、再起服务:
#       docker compose -f docker-compose.yml -f docker-compose.vps.yml run --rm backend make build-knowledge
#   (或者在本机建好 data/chroma/ 之后整个目录 scp 上去,省一次 2.2GB 下载。)
#
# 【怎么确认自己没有裸奔】—— 上线后立刻在**别的机器**上跑。
#   ⚠️ 前两条**按模式分岔**,照抄错模式的那组会得到一个「看着像没事」的假结论。
#
#   裸 IP 模式(GYT_SITE_ADDRESS=":80"):
#     curl -sS -o /dev/null -w '%{http_code}\n' http://<VPS_IP>/       → 期望 401
#     curl -sS -o /dev/null -w '%{http_code}\n' http://<VPS_IP>/api/ok → 期望 401
#
#   域名模式(GYT_SITE_ADDRESS=<域名>):**上面两条会得到 308,不是 401,而那不代表出事**。
#     curl -sk --resolve <域名>:443:<VPS_IP> -o /dev/null -w '%{http_code}\n' https://<域名>/       → 期望 401
#     curl -sk --resolve <域名>:443:<VPS_IP> -o /dev/null -w '%{http_code}\n' https://<域名>/api/ok → 期望 401
#
#   为什么域名模式下不能直接 curl :80(2026-08-11 起容器实测):
#   Caddy 一旦启用 automatic HTTPS,就会在站点块**之外**另起一台独立服务器
#   (日志里叫 `remaining_auto_https_redirects`)专管 :80,对**任意 Host、任意路径**
#   无差别 308 到 https。第 113 行 `{$GYT_SITE_ADDRESS} {` 那个带 basic_auth 的站点块
#   **根本没被进入** —— 所以这条命令验证到的只是「重定向存在」,
#   **验不到口令层有没有生效**,而它回的 308 又足够像「服务活着」,很容易被当成通过。
#   跟 `-L` 追下去更糟:https://<VPS_IP>/ 的 SNI 是裸 IP、选不出域名的证书,
#   握手直接炸(实测 `tlsv1 alert internal error`,curl 的 %{http_code} 是 000)——
#   既不是 401 也不是 200,紧张时刻很难判断「到底锁没锁」。
#   `--resolve` 就是为了让 SNI 走域名、而连接落到你指定的那台机器上。
#
#   第三条两种模式通用:
#     curl -sS -m 5 -o /dev/null -w '%{http_code}\n' http://<VPS_IP>:2024/ok → 期望连不上(超时/拒绝)
#   它**必须**在别的机器上跑。在 VPS 自己身上跑走的是 127.0.0.1,
#   测不出「有没有对公网开」这件事。
# =============================================================================
